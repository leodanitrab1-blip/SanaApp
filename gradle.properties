# ============================================
# 🌿 SANA - Propiedades de Gradle
# Configuración global de la JVM y optimizaciones
# ============================================

# === Configuración JVM ===
# Memoria máxima para el daemon de Gradle (4GB recomendado para proyectos medianos)
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Número de workers paralelos (ajusta según núcleos de CPU del CI/CD)
# GitHub Actions tiene 2-4 núcleos, desarrollo local puede tener más
org.gradle.parallel=true
org.gradle.workers.max=4

# === Configuración de caching ===
# Habilita el cache de configuración (Gradle 8.0+)
org.gradle.configuration-cache=true
# Habilita el cache de build (acelera builds subsecuentes)
org.gradle.caching=true

# === Configuración Android ===
# Usa AndroidX en lugar de las bibliotecas de soporte antiguas
android.useAndroidX=true

# Habilita recursos no transitivos (reduce tamaño de APK)
android.nonTransitiveRClass=true

# Habilita Jetpack Compose (necesario para proyectos Compose)
android.enableJetifier=false

# === Configuración Kotlin ===
# Estilo de código oficial de Kotlin
kotlin.code.style=official

# Habilita características experimentales de Kotlin si es necesario
# kotlin.experimental.tryK2=true

# === Optimizaciones de build ===
# Evita que Gradle descargue dependencias de fuentes innecesarias
android.defaults.buildfeatures.buildconfig=true

# Deshabilita la generación de BuildConfig en módulos que no lo necesitan
# (reduce tiempo de compilación)
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# === Configuración de versiones ===
# Versión mínima de SDK para el proyecto
# android.minSdk=26

# === Debug ===
# Muestra más información durante la compilación (útil para depurar errores)
# org.gradle.logging.level=info