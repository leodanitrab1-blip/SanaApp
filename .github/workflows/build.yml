name: 🌿 Sana App - Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: 🔨 Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: ☕ Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🔧 Dar permisos a gradlew
      run: chmod +x gradlew

    - name: 📦 Configurar Gradle Wrapper
      run: |
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          echo "Generando Gradle Wrapper con versión 8.4..."
          gradle wrapper --gradle-version 8.4 --no-daemon
        fi

    - name: 🔨 Compilar APK Debug
      run: ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all

    - name: 📱 Subir APK Debug
      uses: actions/upload-artifact@v4
      with:
        name: Sana-Debug-${{ github.run_number }}
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: 📊 Resumen
      run: |
        echo "## 🌿 Sana App - Build #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Compilación exitosa" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📱 **APK disponible en Artifacts**" >> $GITHUB_STEP_SUMMARY
