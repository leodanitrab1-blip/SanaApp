name: 🌿 Sana App - Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: 🔨 Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: ☕ Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🔧 Dar permisos a gradlew
      run: chmod +x gradlew

    - name: 📦 Configurar Gradle Wrapper
      run: |
        # Si no existe gradle-wrapper.jar, generar el wrapper
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          echo "Generando Gradle Wrapper..."
          gradle wrapper --gradle-version 8.4
        fi

    - name: 🧹 Limpiar proyecto
      run: ./gradlew clean --no-daemon --stacktrace

    - name: 🔨 Compilar APK Debug
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: 📱 Subir APK Debug
      uses: actions/upload-artifact@v4
      with:
        name: Sana-Debug-${{ github.run_number }}
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: 📊 Resumen
      run: |
        echo "## 🌿 Sana App - Build #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Paso | Estado |" >> $GITHUB_STEP_SUMMARY
        echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| 📥 Checkout | ✅ |" >> $GITHUB_STEP_SUMMARY
        echo "| ☕ JDK 17 | ✅ |" >> $GITHUB_STEP_SUMMARY
        echo "| 🔨 Compilación | ✅ |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📱 **APK disponible en Artifacts**" >> $GITHUB_STEP_SUMMARY
