name: 🌿 Sana App - Build & Deploy

# ============================================
# CI/CD Pipeline para Sana App
# Compila APK debug y release automáticamente
# ============================================

on:
  push:
    branches: 
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  APP_NAME: "Sana"
  JAVA_VERSION: "17"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m"

jobs:
  # ==================== JOB 1: LINT & TEST ====================
  lint-and-test:
    name: 🔍 Análisis y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: ☕ Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🔧 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-*
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🧹 Limpiar proyecto
        run: chmod +x gradlew && ./gradlew clean --no-daemon

      - name: 📋 Ejecutar lint
        run: ./gradlew lintDebug --no-daemon

      - name: 🧪 Ejecutar tests unitarios
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: 📊 Publicar reportes de test
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  # ==================== JOB 2: BUILD DEBUG ====================
  build-debug:
    name: 🔨 Build Debug APK
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 45
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🔧 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}

      - name: 🏗️ Compilar APK Debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📱 Subir APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: Sana-Debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          compression-level: 9

      - name: 📊 Mostrar tamaño APK
        run: |
          APK_SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
          echo "📦 Tamaño del APK: $APK_SIZE"
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV

  # ==================== JOB 3: BUILD RELEASE ====================
  build-release:
    name: 🚀 Build Release APK
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    environment: release
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🔧 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ hashFiles('**/*.gradle.kts') }}

      - name: 🔐 Decodificar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          echo "KEYSTORE_FILE=app/release.keystore" >> $GITHUB_ENV

      - name: 📝 Configurar firma
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "RELEASE_STORE_FILE=app/release.keystore" >> local.properties
          echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> local.properties
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> local.properties
          echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> local.properties

      - name: 🏗️ Compilar APK Release
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          ORG_GRADLE_PROJECT_SIGNING_ENABLED: true

      - name: 📱 Subir APK Release
        uses: actions/upload-artifact@v4
        with:
          name: Sana-Release-${{ github.run_number }}-v${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
          compression-level: 9

      - name: 📊 Generar changelog
        run: |
          echo "## 🚀 Sana v1.0.${{ github.run_number }}" > release_notes.md
          echo "" >> release_notes.md
          echo "### 📝 Cambios:" >> release_notes.md
          git log --oneline -10 >> release_notes.md
          
      - name: 🎉 Crear Release en GitHub
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "🌿 Sana v1.0.${{ github.run_number }}"
          body_path: release_notes.md
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== JOB 4: NOTIFICACIONES ====================
  notify:
    name: 📢 Notificar resultado
    runs-on: ubuntu-latest
    needs: [build-debug, build-release]
    if: always()
    
    steps:
      - name: 📊 Resumen de build
        run: |
          echo "## 🌿 Sana App - Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Lint & Test | ${{ needs.lint-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔨 Debug Build | ${{ needs.build-debug.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Release Build | ${{ needs.build-release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📅 Build #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [Ver workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY